<style>
/* Editor chrome themes. The game preview (.gscreen and .g-*) always keeps the game's own colors.
   --accent is for text and lines; --accent-fill for filled buttons and for highlights drawn over game art. */
:root{
  color-scheme:dark;
  --bg:#12141a; --panel:#191c23; --panel2:#20242d; --panel3:#282d38; --line:#2f3542; --line2:#3b4252; --line3:#4a5263;
  --text:#e7e9ef; --dim:#a0a8b9; --faint:#8b93a6;
  --accent:#d9b45f; --accent-2:#f0cf83; --accent-bg:rgba(217,180,95,.12); --accent-line:rgba(217,180,95,.35);
  --accent-fill:#d9b45f; --on-accent:#1d1606;
  --blue:#7ab0ff; --blue-bg:rgba(110,168,255,.13);
  --green:#5fcf8f; --green-bg:rgba(95,207,143,.13);
  --red:#ef6b73; --red-bg:rgba(239,107,115,.13);
  --purple:#b48cff; --purple-bg:rgba(180,140,255,.13);
  --knob:#cfd4de; --knob-on:#fff;
  --tip-bg:#0b0c10; --scrim:rgba(5,6,10,.62);
  --glass:rgba(25,28,35,.95); --glass-2:rgba(14,16,21,.93);
  --stripe-a:#1b1e26; --stripe-b:#1e222b;
  --log-echo:#b7f3a6; --log-sys:#ffd88a; --log-cmd:#9fc2ff;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"JetBrains Mono",monospace;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f5f6f9; --panel3:#e9ecf1; --line:#e0e4ea; --line2:#ccd2dc; --line3:#b3bbc8;
  --text:#1b2030; --dim:#4f5869; --faint:#5f6778;
  --accent:#8a6410; --accent-2:#6b4d0b; --accent-bg:rgba(201,150,40,.14); --accent-line:rgba(170,125,30,.4);
  --accent-fill:#dcb554; --on-accent:#1d1606;
  --blue:#1a5bb6; --blue-bg:rgba(29,100,200,.1);
  --green:#17804a; --green-bg:rgba(23,128,74,.1);
  --red:#c2333d; --red-bg:rgba(194,51,61,.09);
  --purple:#6d3fc9; --purple-bg:rgba(109,63,201,.1);
  --knob:#fff; --knob-on:#fff;
  --tip-bg:#ffffff; --scrim:rgba(30,35,50,.4);
  --glass:rgba(255,255,255,.95); --glass-2:rgba(250,251,253,.95);
  --stripe-a:#eceff4; --stripe-b:#e6e9ef;
  --log-echo:#17804a; --log-sys:#8a6410; --log-cmd:#1d64c8;
  --shadow:0 12px 32px rgba(20,26,45,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);scrollbar-color:var(--line2) transparent;font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.dim{color:var(--dim)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
#app{display:flex;flex-direction:column;height:100vh}

.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px;margin-right:6px;white-space:nowrap;flex:none}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#d9b45f,#8a6a24);display:grid;place-items:center;color:#1a1408;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:400;color:var(--dim);font-size:11.5px;margin-top:-2px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--dim)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel3);color:var(--text)}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:var(--line3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-bg);border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:6px}
.btn.icon{padding:5px 7px}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--on-accent);display:inline-block}

.main{flex:1;min-height:0;display:flex}
.left{width:470px;min-width:340px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.right{flex:1;min-width:0;overflow:auto}
.toolbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:140px}
.status{display:flex;gap:14px;padding:5px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
.status .status-hints{overflow:hidden;text-overflow:ellipsis;min-width:0}
.credit{color:var(--faint);text-decoration:none;border-left:1px solid var(--line);padding-left:14px;flex:none}
.credit:hover{color:var(--accent)}
.pv-host.drop-over{outline:2px dashed var(--accent);outline-offset:2px}

input.txt,textarea.txt{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:7px;padding:6px 9px;font:inherit;outline:none}
input.txt:focus,textarea.txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input.txt.bad,textarea.txt.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
textarea.txt{font-family:var(--mono);font-size:13px;resize:vertical;min-height:34px;line-height:1.5;tab-size:4}
input.num{width:88px;text-align:right;font-family:var(--mono);font-size:13px;cursor:ew-resize}
input.num:focus{cursor:text}
input.num.scrub{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);user-select:none}

.tree{flex:1;overflow:auto;padding:6px 0 30px}
.row{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;cursor:pointer;border-left:3px solid transparent;min-height:34px;position:relative;user-select:none}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--accent-bg);border-left-color:var(--accent)}
.row.multi{background:var(--blue-bg)}
.row.multi.sel{background:linear-gradient(90deg,var(--accent-bg),var(--blue-bg))}
.row.bar{margin-top:6px;font-weight:600}
.row.bar .lbl{font-size:14.5px}
.row .chev{width:16px;height:16px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:4px}
.row .chev:hover{background:var(--line);color:var(--text)}
.row .chev svg{transition:transform .12s}
.row .chev.open svg{transform:rotate(90deg)}
.row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .cmd{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.row .grow{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent-fill);z-index:2}
.row.drop-before::before{top:-1px} .row.drop-after::after{bottom:-1px}
.row.drop-into{outline:2px dashed var(--accent);outline-offset:-2px}
.row.dragging{opacity:.4}
.thumb{position:relative;width:22px;height:22px;border-radius:5px;flex:none;background:var(--panel3);display:grid;place-items:center;overflow:hidden;font-size:9px;color:var(--dim);font-family:var(--mono)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.lg{width:48px;height:48px;border-radius:9px;font-size:11px}
.thumb.gray img{filter:grayscale(1)} .thumb.flip img{transform:scaleX(-1)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;flex:none}
.chip.cat{background:var(--purple-bg);color:var(--purple)}
.chip.spc{background:var(--panel3);color:var(--dim)}
.chip.key{background:var(--blue-bg);color:var(--blue);font-family:var(--mono);font-size:10.5px}
.chip.mode{background:var(--green-bg);color:var(--green)}
.chip.cond{background:var(--accent-bg);color:var(--accent)}
.chip.hid{background:var(--red-bg);color:var(--red)}
.chip.plain{background:var(--panel3);color:var(--dim)}
.chip.op{background:var(--panel3);color:var(--accent);font-family:var(--mono);font-weight:700;letter-spacing:.4px}
.chip.not{background:var(--red-bg);color:var(--red);font-weight:700}

.cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line2);background:var(--bg);display:grid;place-items:center;flex:none;cursor:pointer;transition:all .1s}
.cb:hover{border-color:var(--accent)}
.cb.on{background:var(--accent-fill);border-color:var(--accent-fill)}
.cb.on::after{content:"";width:4px;height:8px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb.blue.on{background:var(--blue);border-color:var(--blue)}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.sw .track{width:34px;height:19px;border-radius:20px;background:var(--line2);position:relative;transition:background .12s;flex:none}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s}
.sw.on .track{background:var(--accent-fill)}
.sw.on .track::after{transform:translateX(15px);background:var(--knob-on)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:6px;cursor:pointer;color:var(--dim);font-size:13px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.dd{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;min-width:110px;max-width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;cursor:pointer;text-align:left}
.dd:hover{border-color:var(--line3)}
.dd.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dd .dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .dd-caret{color:var(--faint);font-size:9px}
.pop{position:fixed;z-index:1000;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:180px;max-height:380px;display:flex;flex-direction:column;outline:none}
.pop .pop-search{margin:2px 2px 6px}
.pop .pop-list{overflow:auto;flex:1}
.pop .opt{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.pop .opt:hover,.pop .opt.hi{background:var(--panel3)}
.pop .opt.cur{color:var(--accent)}
.pop .opt .hint{margin-left:auto;color:var(--faint);font-size:12px;font-family:var(--mono);padding-left:14px}
.pop .grp{padding:8px 10px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint)}
.pop .empty{padding:10px;color:var(--faint)}
.pop.ctx{padding:4px;min-width:220px}
.pop .ctx-opt{gap:9px;padding:6px 10px}
.pop .ctx-ic{width:14px;display:grid;place-items:center;color:var(--dim);flex:none}
.pop .ctx-opt.danger{color:var(--red)} .pop .ctx-opt.danger .ctx-ic{color:var(--red)}
.pop .ctx-opt.danger:hover{background:var(--red-bg)}
.pop .ctx-opt.disabled{opacity:.4;cursor:default} .pop .ctx-opt.disabled:hover{background:transparent}
.pop .ctx-sep{height:1px;background:var(--line);margin:4px 6px}

.insp{max-width:980px;padding:22px 28px 60px}
.insp-hd{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.insp-hd h2{margin:0;font-size:19px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{font-size:12.5px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--dim);cursor:pointer;text-decoration:none}
.crumb a:hover{color:var(--accent)}
.link{color:var(--accent);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.compass{display:grid;grid-template-columns:repeat(5,28px);grid-template-rows:repeat(5,24px);gap:3px;flex:none}
.compass.screen{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,30px);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:4px}
.snp{border:1px solid var(--line2);background:var(--panel3);border-radius:5px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--dim)}
.snp:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.snp i{display:block;width:12px;height:6px;border-radius:2px;background:currentColor}
.snp.v i{width:6px;height:12px}
.compass.screen .snp{border-color:transparent;background:transparent}
.compass.screen .snp:hover{border-color:var(--accent);background:var(--accent-bg)}
.snp.mid{background:var(--bg);border-style:dashed;font-size:11px;line-height:1.25;padding:3px;overflow:hidden;color:var(--text)}
.snp.mid span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.slot.add{background:transparent;border-style:dashed}
.slot-n{width:22px;text-align:center;color:var(--dim);font-weight:600;flex:none}
.slot-bars{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:0}
.slot-act{display:flex;gap:2px;flex:none}
.chip .x{cursor:pointer;margin-left:2px;color:var(--faint);font-size:13px;line-height:1}
.chip .x:hover{color:var(--red)}
.chip .eye{cursor:pointer;display:inline-grid;place-items:center;color:var(--faint);margin-right:2px}
.chip .eye:hover{color:var(--text)}
.chip.showing{border-color:var(--green)}
.chip.showing .eye{color:var(--green)}
.opt .mk{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:700;flex:none}
.opt .mk.ok{background:var(--green-bg);color:var(--green)}
.opt .mk.q{background:var(--accent-bg);color:var(--accent)}
.src-grid{display:grid;grid-template-columns:22px 1fr auto;gap:14px 12px;align-items:start}
.src-st{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;line-height:1;font-weight:700;margin-top:1px}
.src-st.ok{background:var(--green-bg);color:var(--green)}
.src-st.warn{background:var(--accent-bg);color:var(--accent)}
.src-st.off{background:var(--panel3);color:var(--faint);font-size:18px}
.src-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.src-detail{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5}
.src-feeds{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font-size:11.5px}
.src-st.note{background:var(--blue-bg);color:var(--blue);font-style:italic;font-family:Georgia,serif}
.src-more{background:none;border:0;padding:0;margin-top:7px;color:var(--accent);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.src-more:hover{text-decoration:underline}
.src-probs{margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.src-prob{display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;font-size:12.5px}
.src-prob + .src-prob{border-top:1px solid var(--line)}
.src-prob-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-fill);margin-left:6px;vertical-align:2px}
.rv-row{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;font-size:12.5px}
.rv-row + .rv-row{border-top:1px solid var(--line)}
.rv-sign{font-weight:700;font-family:var(--mono);text-align:center}
.rv-sign.rv-add,.chip.rv-add{color:var(--green)}
.rv-sign.rv-remove,.chip.rv-remove{color:var(--red)}
.rv-sign.rv-change,.chip.rv-change{color:var(--accent)}
.chip.rv-add{background:var(--green-bg)}.chip.rv-remove{background:var(--red-bg)}.chip.rv-change{background:var(--accent-bg)}
.rv{max-height:60vh;overflow:auto}
kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);white-space:nowrap}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.keys-row{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:12px;align-items:baseline;padding:4px 0;font-size:12.5px}
.tour{position:fixed;inset:0;z-index:9000}
.tour-spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.62);border:2px solid var(--accent-fill);transition:all .25s ease;pointer-events:none}
.tour-card{position:fixed;width:320px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px;box-shadow:var(--shadow);transition:left .25s ease,top .25s ease}
.tour-offer{position:fixed;right:18px;bottom:44px;z-index:8000;width:280px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
@media (max-width:700px){.keys{grid-template-columns:1fr}}
.modal.ip{width:min(1040px,calc(100vw - 32px));height:min(820px,calc(100vh - 40px))}
.modal.ip .m-bd{flex:1;min-height:0}
.modal.ip .m-ft{justify-content:flex-start}

/* Config check: things in the file that are broken, clash, or do nothing. Each check lists where the problem is.
   Problems that only exist in hidden bars never raise a warning (they can't show in game). */
function configChecks(){
  const d = S.doc, sets = d.CndSetCfgs, all = allShortcuts(d), out = [];
  const shItem = (sh, ctx, code) => ({code, name: displayName(sh) || parseName(sh.n).tooltip || "(icon only)", where: locationText(sh), hidden: !!ctx.bar.h, go: () => goTo(sh)});
  const barItem = (bar, code) => ({code, name: bar.n || "(unnamed bar)", where: "Bar", hidden: !!bar.h, go: () => goTo(bar)});
  const setItem = (i, code, where) => ({code, name: sets[i]?.n || `Set #${i + 1}`, where: where || `Condition set #${i + 1}`, go: () => { S.selSet = i; S.view = "conds"; render(); }});
  const add = (key, title, level, detail, items, one = "item", many = "items") => out.push({key, title, level, detail, items, one, many});

  // 1. Links to condition sets that don't exist (the plugin treats them as no set)
  const dangling = [];
  d.BarCfgs.forEach(b => { if (b.c >= sets.length) dangling.push(barItem(b, `#${b.c + 1}`)); });
  sets.forEach((s, i) => s.c.forEach(c => { if (c.i === "cs" && (typeof c.a !== "number" || c.a < 0 || c.a >= sets.length)) dangling.push(setItem(i, `#${(+c.a || 0) + 1}`, `Condition set #${i + 1} refers to a set that doesn't exist`)); }));
  add("dangling", "Links to missing condition sets", "warn", "A bar or a Condition Set row points at a set number that isn't in the file.", dangling, "link", "links");

  // 2. Hotkeys that clash (QoLBar Keybind.cs): a shortcut's hotkey only works while its bar is shown (not hidden, set
  // true), and every shortcut with the pressed key fires. A bar's hotkey opens it as a pie while its set is true, even
  // when hidden, and the first such bar in the list wins. A pie key shared with a shortcut is fine (hold vs tap).
  // Two bars surely show together when they're the same bar, share a set, or one has none; other pairs only might.
  const together = (a, b) => a === b || a.c === b.c || a.c < 0 || b.c < 0;
  const clashes = (groups, item) => {
    const warn = [], note = [];
    for (const g of groups.values()) {
      if (g.length < 2) continue;
      const sure = g.some((x, i) => g.some((y, j) => i < j && together(x.bar, y.bar)));
      (sure ? warn : note).push(...g.map(item));
    }
    return {warn, note};
  };
  const shKeys = new Map();
  all.forEach(([sh, ctx]) => { if (sh.k && !ctx.bar.h) { if (!shKeys.has(sh.k)) shKeys.set(sh.k, []); shKeys.get(sh.k).push({sh, ctx, bar: ctx.bar}); } });
  const sc = clashes(shKeys, x => shItem(x.sh, x.ctx, hotkeyName(x.sh.k)));
  add("hotkeys", "Shortcut hotkeys used more than once", "warn", "These shortcuts share a key and show at the same time, so one key press runs all of them.", sc.warn, "shortcut", "shortcuts");
  add("hotkeys2", "Shortcut hotkeys shared across condition sets", "note", "These share a key but sit in bars with different condition sets. That's fine (and handy for alternates like Enable / Disable) as long as those bars never show together.", sc.note, "shortcut", "shortcuts");
  const pieKeys = new Map();
  d.BarCfgs.forEach(b => { if (b.k) { if (!pieKeys.has(b.k)) pieKeys.set(b.k, []); pieKeys.get(b.k).push({bar: b}); } });
  const pc = clashes(pieKeys, x => ({...barItem(x.bar, hotkeyName(x.bar.k)), hidden: false}));
  add("pies", "Pie menu hotkeys used more than once", "warn", "Several bars open as a pie on the same key. Only the first one in the list opens.", pc.warn, "bar", "bars");
  add("pies2", "Pie menu hotkeys shared across condition sets", "note", "These bars share a pie key but have different condition sets. When more than one set is true, only the first bar in the list opens.", pc.note, "bar", "bars");

  // 3. Plugin conditions and commands vs what's installed (only when dalamudConfig.json is loaded)
  const inst = PROFILE.plugins ? new Set(PROFILE.plugins.map(x => x[0])) : null;
  if (inst) {
    const notInst = [];
    sets.forEach((s, i) => s.c.forEach(c => { if (c.i === "p" && typeof c.a === "string" && c.a && !inst.has(c.a)) notInst.push(setItem(i, c.a, `Condition set #${i + 1}: ${c.n ? "NOT " : ""}Plugin Enabled`)); }));
    add("plugcond", "Conditions on plugins you don't have", "note", "These check a plugin that isn't installed, so they're always false (or always true when negated). Fine if the config is meant for someone else.", notInst, "condition", "conditions");
    const norm = t => t.toLowerCase().replace(/[^a-z0-9]/g, "");
    const known = new Set([...inst].flatMap(n => [norm(n), norm(COMMON_PLUGINS[n] || n)]));
    const cmds = [];
    all.forEach(([sh, ctx]) => { for (const m of String(sh.c || "").matchAll(/\/xl(?:enable|disable|toggle)plugin\s+"?([^"\n]+?)"?\s*$/gim)) { const k = norm(m[1]); if (![...known].some(x => x === k || k.startsWith(x) || x.startsWith(k))) cmds.push(shItem(sh, ctx, m[1].trim())); } });
    add("plugcmd", "Plugin commands that don't match an installed plugin", "note", "The name after /xlenableplugin or /xldisableplugin must be the plugin's display name. These don't look like any installed plugin; check the spelling in /xlplugins.", cmds, "command", "commands");
  }

  // 4. Things that do nothing
  const unused = sets.map((s, i) => i).filter(i => !d.BarCfgs.some(b => b.c === i) && !sets.some(s => s.c.some(c => c.i === "cs" && c.a === i))).map(i => setItem(i, `#${i + 1}`));
  add("unusedsets", "Condition sets nothing uses", "note", "No bar and no other set refers to these. Safe to keep; they just don't do anything.", unused, "set", "sets");
  const empty = [];
  d.BarCfgs.forEach(b => { if (!(b.sL || []).length) empty.push(barItem(b, "empty")); });
  all.forEach(([sh, ctx]) => { if (sh.t === 1 && !(sh.sL || []).length) empty.push(shItem(sh, ctx, "empty")); });
  add("empty", "Empty bars and categories", "note", "Nothing inside, so they show as a blank bar or open an empty popup.", empty);
  const noCmd = all.filter(([sh]) => sh.t === 0 && !String(sh.c || "").trim()).map(([sh, ctx]) => shItem(sh, ctx, "no command"));
  add("nocmd", "Shortcuts with no command", "note", "Clicking these does nothing. Fine for labels and decoration.", noCmd, "shortcut", "shortcuts");
  return out;
}

  if (POP) { if (e.key === "Escape") { e.stopPropagation(); closePop(); } return; }
  if (document.querySelector(".scrim")) return;
  if (e.target.closest?.("input,textarea,.hk")) return;
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (mod && key === "z" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); return undo(); }
  if (mod && (key === "y" || (key === "z" && e.shiftKey))) { e.preventDefault(); e.stopPropagation(); return redo(); }
  if (mod && key === "s") { e.preventDefault(); e.stopPropagation(); return save(); }
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); if (FS.editPanel) closeEditPanel(); else if (FS.popups.length) closePopups(0); else closeFullscreen(); return; }
  const vk = CODE_TO_VK[e.code]; if (!vk) return;
  const k = vk | (e.shiftKey ? MOD_SHIFT : 0) | (e.ctrlKey ? MOD_CTRL : 0) | (e.altKey ? MOD_ALT : 0);
  let handled = false;
  // Shortcut hotkeys fire for every visible bar that has them (QoLBar Keybind.DoHotkeys)
  for (const en of FS.entries) {
    let hit = null; walkShortcuts(en.bar.sL, s => { if (!hit && s.k === k) hit = s; });
    if (hit) { handled = true; chat(`[${hotkeyName(k)}] ${displayName(hit) || "shortcut"}`, "sys"); const btn = [...en.el.querySelectorAll(".g-btn")].find(b => b._sh === hit); activate(hit, btn, en.bar, 0, null); }
  }
  // A bar's own hotkey opens it as a pie menu while held, if its condition set is true (even when the bar is hidden).
  // The first such bar wins. Pie menus aren't drawn here, so just say what would happen.
  const pie = S.doc.BarCfgs.find(b => b.k === k && (b.c < 0 || S.doc.AlwaysDisplayBars || PV.sets[b.c] !== false));
  if (pie) { handled = true; chat(`[${hotkeyName(k)}] held: opens "${pie.n}" as a pie menu (not shown in the preview)`, "sys"); }
  if (handled) { e.preventDefault(); e.stopPropagation(); }
}

// Opens the picker for a shortcut and applies the result as one undo step

/* ---------- keyboard shortcut sheet (?) and the first-run tour ---------- */
const KEY_SHEET = [

  ["Bars tree", [

    ["Drag", "Reorder, or drop into a category or another bar"],
    ["Delete", "Delete the selected shortcuts"], ["Ctrl+D", "Duplicate the selected shortcuts"], ["Esc", "Clear the selection"]]],
  ["Number boxes", [

function keySheet(){
  const body = h("div", {class: "keys"}, KEY_SHEET.map(([group, rows]) => h("div", {class: "keys-group"},
    h("div", {class: "flabel", style: {margin: "0 0 6px"}}, group),
    ...rows.map(([k, what]) => h("div", {class: "keys-row"}, h("span", null, ...k.split(/(\s+or\s+|,\s|\s\/\s)/).map(p => /^(\s+or\s+|,\s|\s\/\s)$/.test(p) ? h("span", {class: "faint"}, p) : h("kbd", null, p))), h("span", {class: "dim"}, what))))));

// A few stops around the main screen, each pointing at the real thing
const TOUR = [
  {el: () => $("#tree"), title: "Your bars", text: "Every bar and shortcut in the file. Drag to reorder or into categories, tick boxes for bulk edits, right-click for actions."},
  {el: () => $("#insp"), title: "Edit what's selected", text: "Everything QoLBar stores, in plain words. Bars get a live preview and a Pixel placement card to line them up exactly, with one-click snapping next to other bars."},
  {el: () => $(".pvpanel"), title: "Screen preview", text: "Your bars on a screen at your resolution and UI scale, drawn with QoLBar's own math. Click a bar to jump to it. Load dalamudConfig.json here to match your Dalamud style."},
  {el: () => [...document.querySelectorAll(".hdr .btn")].find(b => b.textContent === "Fullscreen"), title: "Try it like in game", text: "Fullscreen shows the bars at real size. Click shortcuts, open categories, test hotkeys, and edit anything in place."},
  {el: () => [...document.querySelectorAll(".tab")].find(t => t.textContent.startsWith("Tricks")), title: "Tricks", text: "Layouts QoLBar can't do alone: several bars lined up to look like one, and Enable / Disable buttons that swap with a plugin's state."},
  {el: () => [...document.querySelectorAll(".tab")].find(t => t.textContent.startsWith("Settings")), title: "Settings", text: "A config check for broken links, clashing hotkeys and leftovers, a list of every file the editor reads, and QoLBar's own options."},
  {el: () => $(".hdr .btn.primary"), title: "Save", text: "You'll see a summary of what changed first, and can revert anything you didn't mean to. Press ? any time for keyboard shortcuts."},

function startTour(){
  if (!S.doc) return;
  if (S.view !== "bars") { S.view = "bars"; render(); }
  if (!PV.open) { PV.open = true; store("pv.open", "1"); render(); }
  store("toured", "1");
  let i = 0;
  const spot = h("div", {class: "tour-spot"}), card = h("div", {class: "tour-card"});
  const layer = h("div", {class: "tour"}, spot, card);
  const end = () => { layer.remove(); removeEventListener("resize", place); document.removeEventListener("keydown", key, true); };
  const key = e => { if (e.key === "Escape") { e.stopPropagation(); end(); } else if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); go(1); } else if (e.key === "ArrowLeft") go(-1); };

    const st = TOUR[i];

      h("div", {class: "faint", style: {fontSize: "11.5px", marginBottom: "4px"}}, `${i + 1} of ${TOUR.length}`),
      h("div", {style: {fontWeight: 650, fontSize: "15px", marginBottom: "6px"}}, st.title),
      h("div", {class: "dim", style: {fontSize: "13px", lineHeight: 1.55}}, st.text),

/* ---------- keyboard / global drop ---------- */
document.addEventListener("keydown", e => {
  if (!S.doc || FS) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "s") { e.preventDefault(); save(); return; }

  else if (mod && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (S.view === "bars" && e.key === "Delete") deleteItems(current());
  else if (S.view === "bars" && mod && k === "d") { e.preventDefault(); duplicate(current()); }
  else if (k === "f" && !mod && !e.altKey) { e.preventDefault(); openFullscreen(); }

// Backdrop screenshot chosen on an earlier visit (kept in IndexedDB)

(async () => {

  let perm = "prompt"; try { perm = await d.queryPermission({mode: "readwrite"}); } catch {}
  if (S.doc) return render();
  if (perm === "granted" && !savedSession()?.dirty) connectFolder(d);
  else render();
})();
